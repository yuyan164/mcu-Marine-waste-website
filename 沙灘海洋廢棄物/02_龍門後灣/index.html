      body {

      .xbutton {
        position: relative;
        z-index: 1;
        min-width: 200px;
        font-size: 1rem;
        font-weight: bold;
        text-align: center;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 0.5s;
        padding: 12px 20px;
        background-color: #ffffff;

        border: 2px solid #4473c400;
        color: #4472c4;
        width: 200px;
        height: 50px;
        border-radius: 100px 100px 100px 100px;
      }
      .xbutton:before {
        content: "";
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        border: 2px solid #4472c4;
        width: 200px;
        height: 50px;
        border-radius: 100px 100px 100px 100px;
      }
      .xbutton:after {
        content: "";
        position: absolute;
        left: 2px;
        top: 2px;
        width: 100%;
        height: 100%;
        z-index: -2;
        border: 2px solid #4473c400;
        width: 200px;
        height: 50px;
        border-radius: 100px 100px 100px 100px;
      }
      .xbutton:hover {
        color: #ffffff;
      }
      .xbutton:hover:after {
        transition: all 0.3s;
        left: 0;
        top: 0;
      }
      .xbutton .inner {
        position: absolute;
        left: 0px;
        top: 0px;
        width: 100%;
        height: 100%;
        z-index: -1;
        overflow: hidden;
        width: 200px;
        height: 50px;
        border-radius: 100px 100px 100px 100px;
      }
      .xbutton .inner .blob {
        position: absolute;
        top: 6px;
        width: 25%;
        height: 100%;
        background: #4472c4;
        border-radius: 100%;
        transform: translate3d(0, 150%, 0) scale(1.7);
        transition: transform 0.45s;
      }
      .xbutton .inner .blob:nth-child(1) {
        left: 0%;
        transition-delay: 0s;
      }
      .xbutton .inner .blob:nth-child(2) {
        left: 30%;
        transition-delay: 0.08s;
      }
      .xbutton .inner .blob:nth-child(3) {
        left: 60%;
        transition-delay: 0.16s;
      }
      .xbutton .inner .blob:nth-child(4) {
        left: 90%;
        transition-delay: 0.24s;
      }
      .xbutton:hover .inner .blob {
        transform: translateZ(0) scale(1.7);
      }

      @keyframes scaleUp {
        to {
          transform: scale(1.5);
        }
      }
